<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Bigly Piez</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Baloo+2:wght@500;600;800&display=swap">
<style>
/* Layout: a status line, a shelf of toy eggs (jukebox Pis on one row), one detail card for the picked pet; diary and face guide fold away. */
:root{
  --bg:#eef0f6; --fg:#23233a; --muted:#62627e; --card:#ffffff; --line:#d6d8e6;
  --lcd:#c3cfa1; --pix:#27311c; --lcdline:#9fae7c;
  --good:#2f8f5b; --warn:#c07a12; --bad:#c43c4c; --idle:#7a7a96;
  --shell-a:#ff9fb8; --shell-b:#8fd3ff; --shell-c:#ffd36e; --shell-d:#b9a4ff; --shell-e:#8ee6b5; --shell-f:#ffb38a; --shell-g:#d0d3e0; --shell-h:#f4a6e8;
  --shadow:rgba(35,35,58,.18); --bubble:#ffffff;
  /* BiglyColor translucent red: change the RGB here only. */
  --bigly-red-rgb:227 27 35;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pixel:"Silkscreen", ui-monospace, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171726; --fg:#ececf6; --muted:#a2a2bf; --card:#22223a; --line:#34345a; --bubble:#2d2d4a;
  --good:#5ccf8f; --warn:#f0b04a; --bad:#ff7486; --idle:#9a9ab8; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171726; --fg:#ececf6; --muted:#a2a2bf; --card:#22223a; --line:#34345a; --bubble:#2d2d4a;
  --good:#5ccf8f; --warn:#f0b04a; --bad:#ff7486; --idle:#9a9ab8; --shadow:rgba(0,0,0,.45); color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;gap:24px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,2.8rem);line-height:1;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);max-width:62ch}
.sample{display:inline-block;font-family:var(--pixel);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;background:var(--warn);color:var(--bg);padding:2px 8px;border-radius:4px;vertical-align:middle}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .95rem var(--body);border:2px solid var(--fg);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn:focus-visible,.dev:focus-visible,.hw:focus-visible,.clean:focus-visible{outline:3px solid var(--warn);outline-offset:3px}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:28px 20px}
.dev{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 18px 18px;position:relative;
  border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;background:radial-gradient(120% 80% at 30% 15%,rgb(255 255 255/.45),transparent 45%),linear-gradient(170deg,rgb(var(--bigly-red-rgb)/.62),rgb(var(--bigly-red-rgb)/.82));-webkit-backdrop-filter:blur(6px) saturate(1.4);backdrop-filter:blur(6px) saturate(1.4);border:1.5px solid rgb(var(--bigly-red-rgb)/.9);box-shadow:inset 0 -10px 0 rgba(0,0,0,.14),inset 0 8px 0 rgba(255,255,255,.3),0 10px 24px rgb(var(--bigly-red-rgb)/.3);
  transition:transform .15s}
.dev:hover{transform:translateY(-3px)}
.dev[aria-current="true"]{box-shadow:inset 0 -10px 0 rgba(0,0,0,.14),inset 0 8px 0 rgba(255,255,255,.3),0 0 0 4px var(--fg),0 10px 24px rgb(var(--bigly-red-rgb)/.3)}
.dev.wobble{animation:wob .5s}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.tag{font-family:var(--pixel);font-size:.72rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);letter-spacing:.05em;text-transform:uppercase;text-align:center}
.screen{width:150px;max-width:100%;aspect-ratio:1/1;background:var(--lcd);border-radius:12px;border:6px solid rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px var(--lcdline);
  display:grid;grid-template-rows:1fr auto;padding:6px;box-sizing:border-box;color:var(--pix);font-family:var(--pixel)}
.screen canvas{width:100%;height:100%;image-rendering:pixelated;display:block;min-height:0}
.screen .lcdtext{font-size:.62rem;text-align:center;text-transform:uppercase;line-height:1.2;min-height:1.2em}
.screen .stats{display:grid;align-content:center;gap:2px;font-size:.66rem;text-transform:uppercase}
.screen .stats div{display:flex;justify-content:space-between}
.hwrow{display:flex;gap:12px}
.hw{width:20px;height:20px;border-radius:50%;background:#3b3550;border:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4);cursor:pointer;color:#fff;font:700 .6rem/20px var(--pixel);text-align:center;padding:0}
.name{font-family:var(--display);font-weight:800;font-size:1.15rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);line-height:1}
.poopbadge{position:absolute;top:2px;right:18px;background:#3b3550;color:#fff;font:700 .62rem var(--pixel);border-radius:999px;padding:3px 7px}
.care{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px}
@media (max-width:760px){.care{grid-template-columns:1fr}}
.care h2{font-family:var(--display);font-size:1.6rem;margin:0;line-height:1.1}
.hero{display:flex;gap:14px;align-items:flex-start;margin-top:12px}
.bigscreen{width:118px;flex:none;aspect-ratio:1/1;background:var(--lcd);border-radius:14px;border:6px solid rgb(var(--bigly-red-rgb)/.7);padding:6px;box-sizing:border-box}
.bigscreen canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.bubble{position:relative;background:var(--bubble);border:2px solid var(--fg);border-radius:14px;padding:10px 12px;font-weight:600;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;top:18px;width:14px;height:14px;background:var(--bubble);border-left:2px solid var(--fg);border-bottom:2px solid var(--fg);transform:rotate(45deg)}
.mood{font-weight:700;margin:12px 0 0}
.meta{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.meters{display:grid;gap:8px;margin-top:12px}
.meter{display:grid;grid-template-columns:6.5em auto 1fr;align-items:center;gap:10px}
.meter b,.label{font-family:var(--pixel);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.label{color:var(--muted);display:block;margin:0 0 6px}
.meter .hearts{font-size:1.15rem;letter-spacing:2px;white-space:nowrap;color:var(--bad)}
.meter span{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.right{display:grid;gap:20px;align-content:start;min-width:0}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl{overflow-x:auto;min-width:0}
.st{font-weight:700;white-space:nowrap;text-align:right}
.todos{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.todos li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:8px 10px}
.todos li.done{opacity:.55;text-decoration:line-through}
.who{font:700 .62rem var(--pixel);text-transform:uppercase;background:var(--fg);color:var(--bg);border-radius:4px;padding:2px 6px;flex:none;margin-top:3px}
.clean{all:unset;cursor:pointer;margin-left:auto;font:700 .62rem var(--pixel);text-transform:uppercase;border:1.5px solid var(--fg);border-radius:999px;padding:2px 8px;flex:none}
.todos span.txt{min-width:0}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:600 10px var(--body);fill:var(--muted)}
.diary{display:grid;gap:0;margin:0;padding:0;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:14px}
.diary li{display:grid;grid-template-columns:4.2em 9em minmax(0,1fr);gap:12px;padding:9px 14px;border-bottom:1px solid var(--line)}
.diary li:last-child{border-bottom:none}
.diary .d{font:700 .75rem var(--pixel);color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.diary .p{font-weight:700}
@media (max-width:560px){.diary li{grid-template-columns:4.2em minmax(0,1fr)}.diary .p{grid-column:2}.diary .e{grid-column:2}}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.leg{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.leg canvas{width:52px;height:52px;image-rendering:pixelated;background:var(--lcd);border-radius:6px;padding:3px;flex:none}
.leg div{min-width:0;font-size:.85rem;color:var(--muted);line-height:1.3}
.leg strong{display:block;color:var(--fg);font-size:.95rem}
h3{font-family:var(--display);font-size:1.2rem;margin:0 0 10px}
.float{position:fixed;pointer-events:none;font-size:1.4rem;color:var(--bad);animation:up 1s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
@media (prefers-reduced-motion:reduce){.dev{transition:none}.dev.wobble{animation:none}.float{animation:none;opacity:0}}

/* Realistic toy: keychain loop, printed faceplate, recessed LCD, icon bar, silver buttons. */
.dev{isolation:isolate;padding:36px 22px 24px;gap:8px;border-radius:50% 50% 47% 47% / 57% 57% 43% 43%;
  background:radial-gradient(38% 22% at 30% 13%,rgb(255 255 255/.7),rgb(255 255 255/0) 70%),radial-gradient(90% 60% at 70% 95%,rgb(0 0 0/.22),transparent 60%),linear-gradient(165deg,rgb(var(--bigly-red-rgb)/.66),rgb(var(--bigly-red-rgb)/.9));
  box-shadow:inset 0 0 0 2px rgb(255 255 255/.22),inset 0 -16px 24px rgb(0 0 0/.24),inset 0 12px 18px rgb(255 255 255/.22),0 16px 24px -8px rgb(0 0 0/.38),0 4px 8px rgb(0 0 0/.14);margin-top:16px}
.dev[aria-current="true"]{box-shadow:inset 0 0 0 2px rgb(255 255 255/.22),inset 0 -16px 24px rgb(0 0 0/.24),inset 0 12px 18px rgb(255 255 255/.22),0 16px 24px -8px rgb(0 0 0/.38);outline:4px solid var(--fg);outline-offset:4px}
.dev::before{content:"";position:absolute;top:-21px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;border:4px solid #c6c9d4;border-bottom-color:#9a9eac;box-shadow:inset 0 1px 2px rgb(0 0 0/.35),0 1px 2px rgb(0 0 0/.3);z-index:-1}
.dev::after{content:"";position:absolute;inset:20px 13px 13px;border-radius:50% 50% 46% 46% / 54% 54% 46% 46%;z-index:-1;
  background:radial-gradient(rgb(255 255 255/.13) 1px,transparent 1.6px) 0 0/9px 9px,radial-gradient(70% 55% at 50% 38%,rgb(255 255 255/.2),rgb(255 255 255/.04) 75%);
  box-shadow:inset 0 2px 5px rgb(0 0 0/.28),0 1px 0 rgb(255 255 255/.28)}
.dev.egg-pet::after{opacity:.6}
.screen{width:128px;border:none;border-radius:7px;padding:7px;position:relative;
  background:linear-gradient(160deg,#cdd8ab,var(--lcd) 60%,#b4c191);
  box-shadow:0 0 0 5px #2b2734,0 0 0 7px rgb(255 255 255/.3),0 3px 0 7px rgb(0 0 0/.18),inset 0 3px 7px rgb(0 0 0/.3)}
.screen::after{content:"";position:absolute;inset:0;border-radius:7px;pointer-events:none;background:linear-gradient(125deg,rgb(255 255 255/.32),rgb(255 255 255/0) 38%)}
.icons{display:flex;justify-content:space-between;width:120px;color:rgb(35 12 20/.62)}
.icons .ic{width:13px;height:13px;display:block;shape-rendering:crispEdges}
.icons.top{margin-bottom:4px}.icons.bot{margin-top:4px}
.tag{font-size:.64rem;color:rgb(255 255 255/.92)}
.name{font-size:1.1rem;letter-spacing:.01em}
.hwrow{gap:16px;align-items:flex-start;margin-top:4px}
.hw{width:26px;height:26px;color:#4a4558;font:700 .62rem/26px var(--pixel);
  background:radial-gradient(circle at 35% 30%,#fbfbfd,#c3c6d3 55%,#8d91a2);
  box-shadow:0 2px 0 rgb(0 0 0/.35),inset 0 -2px 2px rgb(0 0 0/.18),0 0 0 3px rgb(0 0 0/.2)}
.hw:nth-child(2){margin-top:9px}
.hw:active{transform:translateY(2px);box-shadow:0 0 0 rgb(0 0 0/.35),inset 0 -1px 1px rgb(0 0 0/.18),0 0 0 3px rgb(0 0 0/.2)}
.poopbadge{top:16px;right:22px}
.bigscreen{border:none;box-shadow:0 0 0 5px #2b2734,0 0 0 9px rgb(var(--bigly-red-rgb)/.75),inset 0 3px 7px rgb(0 0 0/.3);background:linear-gradient(160deg,#cdd8ab,var(--lcd) 60%,#b4c191)}
.shelf{grid-template-columns:repeat(auto-fill,minmax(min(100%,218px),1fr));gap:40px 22px}

   Tokens generated by plasticTokens(); the look is slabPlastic.css: a circuit board under a coloured film. */

.pl-red{--bigly-red-rgb:213 75 93;--sw:#D54B5D;--lip-edge:rgba(255, 143, 150, 0.5);--lip-sheen:rgba(255, 175, 180, 0.26);--lip-1:#5e0716;--lip-2:#35060f;--lip-3:#26050c;--lip-4:#1a0308;--lip-film-1:rgba(236, 62, 84, 0.15);--lip-film-2:rgba(176, 16, 40, 0.21);--lip-film-3:rgba(74, 5, 18, 0.5);--lip-deep:rgba(74, 5, 18, 0.88);--lip-lamp:rgba(255, 128, 136, 0.13);--lip-rim:rgba(255, 130, 148, 0.3);--lip-under:rgba(46, 3, 12, 0.75);--lip-bloom:rgba(255, 120, 140, 0.2);--lip-gloss:rgba(255, 214, 218, 0.14);--lip-gloss-hi:rgba(255, 234, 236, 0.22);--lip-bubble:rgba(255, 190, 196, 0.13);--lip-lit-in:rgba(255, 176, 190, 0.4);--lip-ic-lit:#2a080f;--lip-ic-body:#0f0204;--lip-ic-low:#050101;--lip-conn-lit:#24070d;--lip-conn-body:#100204;--lip-conn-low:#040001;--lip-can:#1a040b;--lip-can-rim:#090103;--lip-steel-lo:#29080e;--lip-smd:#0b0103;--lip-pad:rgba(189, 71, 61, 0.3);--lip-ink:rgba(255, 224, 224, 0.72);--lip-art-rim:rgba(255, 143, 150, 0.22);--pcb-1:#864137;--pcb-2:#19280f;--pcb-3:#030201;--pcb-trace:rgba(143, 78, 36, 0.72);--pcb-trace-dim:rgba(76, 59, 20, 0.5);--pcb-etch:rgba(3, 1, 1, 0.3);--pcb-ic:#130204;--pcb-leg:rgba(145, 47, 62, 0.42);--pcb-gold:rgba(222, 61, 36, 0.78);--pcb-steel:rgba(188, 62, 79, 0.26)}

/* Jukebox Pis share one row and one plastic (Cherry Red), per BA 2026-10-11. */
.jbox{grid-column:1/-1;min-width:0}
.jlabel{display:block;font:700 .7rem var(--pixel);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 -18px 2px}
.jrow{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:22px;overflow-x:auto;padding:36px 6px 14px;scroll-snap-type:x mandatory}
.jrow>.dev{scroll-snap-align:center}

/* Simplified layout (2026-10-11): one status line, eggs, one detail card; extras folded away. */
header{display:block}
.status{margin:8px 0 0;font-size:1.05rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status .need{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:700;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px}
.status .need:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.status .need .dot{width:10px;height:10px;border-radius:50%}
.status .ok{color:var(--good);font-weight:700}
.status .muted{color:var(--muted)}
.jlabel,.olabel{display:block;font:700 .7rem var(--pixel);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.olabel{grid-column:1/-1;margin:0 0 -26px 2px}
.dev .lcdtext{font-size:.66rem}
.dev .todo-n{font:700 .6rem var(--pixel);text-transform:uppercase;color:var(--lip-ink);min-height:1em}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;padding:0;list-style:none;font-variant-numeric:tabular-nums}
.facts li b{font-weight:700}
.facts .warn{color:var(--warn)} .facts .bad{color:var(--bad)}
.care .right{gap:18px}
.svc{width:100%;border-collapse:collapse}
.specs{margin:16px 0 0}
.specs dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:.92rem}
.specs dt{color:var(--muted)}
.specs dd{margin:0;overflow-wrap:anywhere}
.specs .unsure{color:var(--muted);font-style:italic}
.svc td{padding:5px 0;border-bottom:1px solid var(--line)}
.svc td.st{text-align:right;font:700 .62rem var(--pixel);text-transform:uppercase;white-space:nowrap;padding-left:12px}
.clean{font-size:.66rem;padding:4px 12px}
.more{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.more>summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.1rem;padding:10px 0;list-style-position:inside}
.more>summary:focus-visible{outline:3px solid var(--warn);outline-offset:2px;border-radius:6px}
.more[open]>summary{border-bottom:1px solid var(--line)}
.more .diary{border:0;border-radius:0;background:none}
.more .diary li{padding-inline:0}
.more .legend{padding:12px 0 14px}
.more .leg{background:var(--bg);border:0}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;color:var(--muted);font-size:.9rem}
.foot p{margin:0;max-width:60ch}
.foot .btn{font-size:.85rem;padding:4px 12px}
@media (max-width:560px){
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 12px}
  .jrow{grid-template-columns:repeat(4,150px);gap:12px;padding-top:30px}
  .dev{padding:26px 10px 16px;gap:5px}
  .dev .screen{width:92px;padding:5px}
  .dev .name{font-size:.95rem}
  .dev .hwrow{gap:10px}.dev .hw{width:18px;height:18px;font-size:0}
  .dev .hw:nth-child(2){margin-top:6px}
  .olabel{margin-bottom:-20px}
}

/* Restart controls: only shown when the restart helper answers and your login is allowed. */
.power{margin:14px 0 0}
.confirm{margin:14px 0 0;padding:12px 14px;border:2px solid var(--warn);border-radius:12px;background:var(--card)}
.confirm p{margin:0 0 10px}
#allbox{margin:0}
.btn.primary{background:var(--fg);color:var(--bg)}
.power-msg{margin:14px 0 0;font-weight:700;color:var(--good)} .power-msg.bad{color:var(--bad)}

  const name=id=>(PETS.find(p=>p.id===id)||{name:id}).name;
  Object.entries(res.results).forEach(([id,r])=>pending[id]=r.ok?{msg:`${r.msg} Watching for ${name(id)} to come back…`,since:Date.now(),seenDown:false}:{msg:r.msg,bad:true});
  const failed=Object.keys(res.results).filter(id=>!res.results[id].ok);
  if(failed.length)setTimeout(()=>{failed.forEach(id=>{if(pending[id]&&pending[id].bad)delete pending[id]});render()},15000);
  if(target==="all")showAllSent(ids);render();watch();
}
let watching=null;
function watch(){
  if(watching)return;
  watching=setInterval(async()=>{
    await refreshLive();
    const now=Date.now();let open=0;
    for(const [id,P] of Object.entries(pending)){
      if(!P.since){continue}
      const L=liveOf(id),n=(PETS.find(p=>p.id===id)||{name:id}).name;
      if(L&&!L.online)P.seenDown=true;
      if(L&&L.online&&(P.seenDown||now-P.since>90000)){pending[id]={msg:`${n} is back online.`};setTimeout(()=>{delete pending[id];render()},10000)}
      else if(now-P.since>300000){pending[id]={msg:`${n} hasn't come back after 5 minutes. Someone may need to unplug it and plug it back in.`,bad:true}}
      else open++;
    }
    render();if(!open){clearInterval(watching);watching=null}
  },10000);
}
async function refreshLive(){
  if(location.protocol==="file:")return;
  try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),20000);
    const r=await fetch("api/status",{cache:"no-store",signal:ctl.signal});clearTimeout(t);if(!r.ok)throw 0;const d=await r.json();if(!d.ok||!d.pis)throw 0;LIVE=d}
  catch(e){if(LIVE)LIVE={...LIVE,pis:Object.fromEntries(Object.entries(LIVE.pis).map(([k,v])=>[k,{...v,online:undefined}]))}}
  const any=LIVE&&Object.keys(LIVE.pis).some(canRestart);
  document.getElementById("restartall").hidden=!any;
  footnote();
}
function footnote(){
  if(!LIVE)return;
  const n=PETS.filter(p=>healthOf(p.id)).length;
  document.getElementById("footnote").textContent=`"Online" comes from a live check at ${LIVE.checked}${LIVE.dry?" (test mode: restarts are pretend)":""}. `
    +(n?`Temperature, disk, CPU, memory and time on are live for ${n} Pi${n>1?"s":""} (checked ${HEALTH.checked}, every 2 minutes); a Pi that says "Sample numbers" isn't sending them yet. Services come from the same check; "Not checked" means that Pi hasn't sent them yet.`
      :`Temperatures and disks are samples, and services aren't checked yet.`);
}
async function refreshHealth(){
  if(location.protocol==="file:")return;
  try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),45000);
    const r=await fetch("api/health",{cache:"no-store",signal:ctl.signal});clearTimeout(t);if(!r.ok)throw 0;const d=await r.json();if(!d.ok||!d.pis)throw 0;HEALTH=d}
  catch(e){HEALTH=null}
  footnote();
}
function showAllSent(ids){
  const box=document.getElementById("allbox"),names=ids.map(id=>(PETS.find(p=>p.id===id)||{name:id}).name);
  box.hidden=false;box.innerHTML=`<p role="status">Restart sent to ${names.join(", ")}. Each Pi's card shows when it's back.</p><button class="btn" id="allclose">OK</button>`;
  document.getElementById("allclose").onclick=()=>{box.hidden=true;document.getElementById("restartall").focus()};
}
function showAll(){
  const nm=id=>(PETS.find(p=>p.id===id)||{name:id}).name,box=document.getElementById("allbox"),ids=Object.keys(LIVE.pis).filter(reachable),names=ids.map(nm);
  const off=Object.keys(LIVE.pis).filter(id=>canRestart(id)&&!reachable(id)).map(nm);
  box.hidden=false;
  box.innerHTML=`<p><b>Restart all ${ids.length} Pis?</b> ${names.join(", ")}.${off.length?` ${off.join(", ")} ${off.length>1?"aren't":"isn't"} answering, so ${off.length>1?"they're":"it's"} skipped.`:""} All music stops for a couple of minutes, and this page goes away for a few minutes too (BigPi-002 goes last).</p>
    <button class="btn primary" id="allgo">Yes, restart all</button> <button class="btn" id="allno">Cancel</button>`;
  document.getElementById("allgo").onclick=()=>{box.hidden=true;sendRestart("all")};
  document.getElementById("allno").onclick=()=>{box.hidden=true;document.getElementById("restartall").focus()};
  box.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"});document.getElementById("allgo").focus();
}
function paint(){
  pix=getComputedStyle(document.documentElement).getPropertyValue("--pix").trim()||pix;
  document.querySelectorAll("canvas[data-m]").forEach(cv=>(cv.width!==100&&(cv.width=cv.height=100),draw)(cv.getContext("2d"),cv.dataset.m,frame,cv.dataset.hat,+cv.dataset.poop));
}
document.getElementById("diary").innerHTML=DIARY.map(([d,p,e])=>`<li><span class="d">${d}</span><span class="p">${p}</span><span class="e">${e}</span></li>`).join("");
document.getElementById("legend").innerHTML=ORDER.map(m=>`<div class="leg"><canvas width="20" height="20" data-m="${m}" data-hat="" data-poop="0"></canvas><div><strong>${MOODS[m].label}</strong>${MOODS[m].why}</div></div>`).join("")
  +`<div class="leg"><canvas width="20" height="20" data-m="ok" data-hat="" data-poop="2"></canvas><div><strong>Poops</strong>Each one is a to-do. Clean it when it's done.</div></div>`;
document.getElementById("badday").onclick=e=>{bad=!bad;e.currentTarget.setAttribute("aria-pressed",bad);e.currentTarget.textContent=bad?"Back to normal":"Preview a bad day";beep(bad?SFX.egg:SFX.care);render()};
document.getElementById("sound").onclick=e=>{soundOn=!soundOn;e.currentTarget.setAttribute("aria-pressed",soundOn);e.currentTarget.textContent=soundOn?"Sound on":"Sound off";beep(SFX.a)};
render();
if(!reduce)setInterval(()=>{frame++;paint()},600);
document.getElementById("restartall").onclick=showAll;
refreshLive().then(render);setInterval(()=>{if(!watching)refreshLive().then(render)},60000);
refreshHealth().then(render);setInterval(()=>refreshHealth().then(render),120000);
</script>
