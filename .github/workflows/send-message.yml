name: Send a message to the channel
on:
  workflow_dispatch:
    inputs:
      text:
        description: The message, as plain text. Links as <https://example.com|label>. Up to 1,900 characters.
        required: true
        type: string
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Post to the channel
        shell: python
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MESSAGE: ${{ inputs.text }}
          PYTHONIOENCODING: utf-8
        # Same webhook as notify-slack.yml, so the same channel. The text arrives in an env var, never in the script.
        run: |
          import json, os, sys, urllib.error, urllib.request

          webhook = os.environ.get("SLACK_WEBHOOK_URL", "")
          text = os.environ.get("MESSAGE", "").strip()
          if not webhook:
              print("::error::SLACK_WEBHOOK_URL secret is not set, so nothing was sent.")
              sys.exit(1)
          if not text or len(text) > 1900:
              print(f"::error::The message must be 1 to 1,900 characters; this one is {len(text)}.")
              sys.exit(1)

          req = urllib.request.Request(webhook, data=json.dumps({"text": text}).encode(), headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  code, body = r.status, r.read().decode(errors="replace")
          except urllib.error.HTTPError as e:
              code, body = e.code, e.read().decode(errors="replace")
          print(f"The channel answered HTTP {code}: {body[:200]}")
          if code not in (200, 204) or (code == 200 and body.strip() not in ("", "ok") and '"ok":true' not in body.replace(" ", "")):
              print("::error::The channel did not take the message; the webhook may be wrong, expired or revoked.")
              sys.exit(1)
          print("Sent.")
